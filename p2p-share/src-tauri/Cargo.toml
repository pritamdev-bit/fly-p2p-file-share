[package]
name = "fly"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Pinned exact per plan (0.x has no stability guarantee). Research + code
# target these versions; review the iroh-blobs changelog on every bump.
# unstable-net-report gates the NAT introspection used by diagnostics. It is
# explicitly not semver-covered upstream, but the exact pin below makes
# that a non-issue: it cannot change under us; review on every bump.
iroh = { version = "=1.3.0", features = ["unstable-net-report"] }
iroh-blobs = "=0.103.1"
anyhow = "1"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
# deep-link feature: a second launch (fly:// click while running) routes
# its URL through the deep-link handler instead of opening a new window.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
